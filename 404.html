<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada · Sabor 360</title>
    <meta name="description" content="La página que buscas no está en nuestro menú. Vuelve al inicio de Sabor 360.">
    <meta name="robots" content="noindex, follow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@300;400;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/main.css">
    <style>
        :root {
            --e-ink: #1a1209;
            --e-bg: #fafaf7;
            --e-accent: #c8421a;
            --e-dark: #0d0d0d;
            --e-mute: #8a8275;
            --e-line: #e6e2d8;
        }

        .err,
        .err * { box-sizing: border-box; }

        .err {
            min-height: 100vh;
            padding: 140px 2rem 4rem;
            background: var(--e-bg);
            color: var(--e-ink);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .err::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background:
                radial-gradient(ellipse at 30% 30%, rgba(200,66,26,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 70%, rgba(0,168,89,0.06) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .err__inner {
            position: relative;
            z-index: 1;
            max-width: 880px;
            text-align: center;
        }

        .err__eyebrow {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--e-accent);
            padding: 0.55rem 1.1rem;
            border: 1px solid var(--e-accent);
            margin-bottom: 2.5rem;
        }

        .err__code {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(7rem, 22vw, 16rem);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.04em;
            color: var(--e-ink);
            margin: 0 0 1.5rem;
            position: relative;
            display: inline-block;
        }

        .err__code span {
            display: inline-block;
            background: linear-gradient(135deg, var(--e-accent) 0%, #e8621a 50%, #c8421a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
            transform: translateY(-6px);
        }

        .err__rule {
            display: block;
            width: 80px;
            height: 3px;
            background: var(--e-accent);
            margin: 0 auto 2rem;
        }

        .err__title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.5rem, 3.5vw, 2.5rem);
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -0.015em;
            color: var(--e-ink);
            margin: 0 0 1rem;
        }

        .err__text {
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: clamp(1rem, 1.4vw, 1.18rem);
            line-height: 1.6;
            color: var(--e-mute);
            max-width: 560px;
            margin: 0 auto 2.5rem;
            font-weight: 300;
        }

        .err__text em {
            font-style: italic;
            color: var(--e-ink);
        }

        .err__cta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .err__btn {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 1rem 1.85rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border: 2px solid transparent;
            transition: all .25s ease;
            cursor: pointer;
        }
        .err__btn svg { width: 16px; height: 16px; }

        .err__btn--solid {
            background: var(--e-ink);
            color: #fff;
            border-color: var(--e-ink);
        }
        .err__btn--solid:hover {
            background: var(--e-accent);
            border-color: var(--e-accent);
            transform: translateY(-2px);
        }

        .err__btn--ghost {
            background: transparent;
            color: var(--e-ink);
            border-color: var(--e-ink);
        }
        .err__btn--ghost:hover {
            background: var(--e-ink);
            color: #fff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .err { padding: 120px 1.25rem 3rem; }
            .err__eyebrow { font-size: 0.65rem; margin-bottom: 2rem; padding: 0.45rem 0.9rem; }
            .err__cta { flex-direction: column; align-items: stretch; }
            .err__btn { justify-content: center; }
        }

        @media (max-width: 480px) {
            .err__code { font-size: clamp(6rem, 28vw, 9rem); }
        }
    </style>
</head>
<body data-page="404">

<div data-partial="header"></div>

<main class="err">
    <div class="err__inner">
        <span class="err__eyebrow">Error 404 · Not found</span>

        <h1 class="err__code">
            4<span>0</span>4
        </h1>

        <span class="err__rule" aria-hidden="true"></span>

        <h2 class="err__title">Este plato no está en el menú.</h2>

        <p class="err__text">
            La receta que buscabas se quemó, se movió de mesa o nunca existió.
            Pero la cocina sigue abierta — <em>vuelve al comedor principal</em>
            y descubre lo que está servido hoy.
        </p>

        <div class="err__cta">
            <a href="/" class="err__btn err__btn--solid">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 3l10 9h-3v9h-5v-6H10v6H5v-9H2l10-9z"/>
                </svg>
                Volver al inicio
            </a>
            <a href="/podcast" class="err__btn err__btn--ghost">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                Ver videos y podcast
            </a>
        </div>
    </div>
</main>

<div data-partial="footer"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
